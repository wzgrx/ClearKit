[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
compileSdk = "37"
# Android 17 QPR2 平台（platforms;android-37.2）
compileSdkMinor = "2"
buildTools = "37.0.0"
targetSdk = "37"
minSdk = "28"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
coreKtx = "1.19.1"
coroutines = "1.11.0"
serializationJson = "1.11.0"
room = "2.8.5"
okhttp = "5.5.0"
# 内置离线语音识别（阶段 6B7 补全）：vosk-android 0.3.75 按 JNA 5.18.1 构建。
vosk = "0.3.75"
jna = "5.18.1"
# 新版本【宿主】本机适配：在 App 里用 DexKit 解析手机上的【宿主】APK，按 core/symbols 的查询生成符号表。
dexkit = "2.3.0"
# DexKit AAR 的 POM 依赖的 FlatBuffers 版本（App 里随 AAR 传递进来；电脑上的 DexKitParityTest 要单独加，升级 DexKit 时一起核对）。
dexkitFlatbuffers = "23.5.26"
coil = "3.6.3"
# 液态玻璃（Compose 背景取样、模糊、透镜折射）和它用的连续曲率圆角
backdrop = "2.0.1"
kyantShapes = "1.2.1"
media3 = "1.11.1"
work = "2.12.0"
libxposed = "102.0.0"
dexlib2 = "3.0.10"
junit = "4.13.2"
robolectric = "4.17"
# 桌面小组件（AUDIT 6C9）
glance = "1.2.0"

[libraries]
# DexAdapt（../dexadapt，复合构建）
dexadapt-core = { module = "io.github.wzgrx.dexadapt:dexadapt-core", version = "0.2.1" }
dexadapt-dexlib = { module = "io.github.wzgrx.dexadapt:dexadapt-dexlib", version = "0.2.1" }
dexadapt-dexkit = { module = "io.github.wzgrx.dexadapt:dexadapt-dexkit", version = "0.2.1" }
dexadapt-dexkit-desktop = { module = "io.github.wzgrx.dexadapt:dexadapt-dexkit-desktop", version = "0.2.1" }
dexadapt-runtime = { module = "io.github.wzgrx.dexadapt:dexadapt-runtime", version = "0.2.1" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
# 写 EXIF 用 androidx 版（修了各版本系统 ExifInterface 的问题，lint ExifInterface）；已经是传递依赖，版本取同一个。
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version = "1.4.2" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
# 界面截图（app 的 Robolectric 测试，-Pbc.shots 时才跑）
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vosk-android = { module = "com.alphacephei:vosk-android", version.ref = "vosk" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
dexkit = { module = "org.luckypray:dexkit", version.ref = "dexkit" }
dexkit-flatbuffers = { module = "com.google.flatbuffers:flatbuffers-java", version.ref = "dexkitFlatbuffers" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
kyant-shapes = { module = "io.github.kyant0:shapes", version.ref = "kyantShapes" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed" }
dexlib2 = { module = "com.android.tools.smali:smali-dexlib2", version.ref = "dexlib2" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version = "1.7.0" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
